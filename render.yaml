services:
  api:
    type: web
    name: scamshield-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn upishield_core.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:////var/task/data/scamshield.db
      - key: SECRET_KEY
        value: ${SECRET_KEY}
      - key: CORS_ORIGINS
        value: ["http://scamshield-frontend.onrender.com"]
      - key: PROMETHEUS_ENABLED
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      - key: MODEL_DIR
        value: ./models
    healthCheckPath: /health
    autoDeploy: true
    branch: main

  frontend:
    type: web
    name: scamshield-frontend
    buildCommand: cd frontend && npm ci && npm run build
    startCommand: cd frontend && npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://scamshield-api.onrender.com
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
    healthCheckPath: /
    autoDeploy: true
    branch: main
    # This service depends on the API
    # Render will handle the routing

databases:
  - name: scamshield-redis
    plan: free
    # Note: Redis is optional for this project

# Optional: Add a cron job for maintenance
crons:
  - name: cleanup-old-sessions
    schedule: "0 2 * * *"
    command: python scripts/cleanup_sessions.py